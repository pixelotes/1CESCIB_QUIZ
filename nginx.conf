server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Comprime texto y JSON (los woff2 ya están comprimidos).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    # No cachear HTML ni manifest (cambian con los nuevos quizzes).
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /quizzes.json { add_header Cache-Control "no-cache"; }

    # Fuentes y woff2: cache largo, son inmutables.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # JSON de quizzes: dejados en su carpeta, sin cache (puedes editarlos en caliente).
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
